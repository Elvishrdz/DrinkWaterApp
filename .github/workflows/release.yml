name: Release to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      update_listing:
        description: "Update Play Store listing assets"
        required: false
        default: false
        type: boolean

jobs:
  release:
    name: Build & Upload AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/release.jks

      # Validate that every unit test still passes at the point of release.
      # Uses the debug-variant unit tests only (the single host unit-test task AGP
      # generates); a failure here stops the workflow before the AAB is built or
      # uploaded to Play. This does not touch the build/upload steps below.
      # retention days: 1-90
      - name: Run unit tests (debug)
        run: ./gradlew :compose:testDebugUnitTest --stacktrace

      # Always publish the results so they can be downloaded and reviewed, even
      # when the test step above fails.
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-unit-test-results
          path: |
            compose/build/reports/tests/testDebugUnitTest/
            compose/build/test-results/testDebugUnitTest/
          retention-days: 90
          if-no-files-found: warn

      - name: Build release AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN }}
        run: ./gradlew :compose:bundleRelease

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.eahm.drinkwaterapp
          releaseFiles: compose/build/outputs/bundle/release/*.aab
          mappingFile: compose/build/outputs/mapping/release/mapping.txt
          # Native debug symbols are embedded in the .aab automatically (ndk.debugSymbolLevel
          # = SYMBOL_TABLE) and extracted by Play on upload. The standalone
          # native-debug-symbols.zip is only produced by APK assembly, not bundleRelease,
          # so it must not be referenced here.
          tracks: ${{ github.event.inputs.track }}
          whatsNewDirectory: release-notes/
          changesNotSentForReview: ${{ github.event.inputs.track == 'production' }}

      - name: Clean up keystore
        if: always()
        run: rm -f $RUNNER_TEMP/release.jks

  update-listing:
    name: Update Store Listing
    needs: release
    if: ${{ inputs.update_listing == true }}
    uses: ./.github/workflows/listing.yml
    with:
      mode: "all"
      locale: ""
    secrets: inherit
