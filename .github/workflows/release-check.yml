name: Release Verification

# Runs automatically when a release branch is pushed and on workflow_dispatch
# before the actual release.yml is triggered.
on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Release Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Compile release sources
        env:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY || 'ci_placeholder' }}
          MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN || 'ci_placeholder' }}
        run: ./gradlew compileReleaseKotlin --stacktrace

      # AGP 9.x only generates host unit-test tasks for the testBuildType (debug),
      # so there is no testReleaseUnitTest task. Unit tests run against the same
      # (non-minified) sources regardless of build type, so testDebugUnitTest is
      # the correct and only available coverage.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --continue

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: "**/build/reports/tests/"
          retention-days: 14

      - name: Run Detekt
        run: ./gradlew detekt --continue

      - name: Run Lint (release variant)
        run: ./gradlew lintRelease --continue

      - name: Upload Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-lint-reports
          path: "**/build/reports/lint-results*.html"
          retention-days: 14

      - name: Assemble release APK (smoke-test — no signing)
        env:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY || 'ci_placeholder' }}
          MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN || 'ci_placeholder' }}
        run: ./gradlew :compose:assembleDebug --stacktrace

      - name: Summary
        if: always()
        run: |
          echo "## Release Verification Summary" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Run ID: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Review artifacts above before triggering \`Release to Google Play\` workflow." >> $GITHUB_STEP_SUMMARY
