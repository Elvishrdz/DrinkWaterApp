name: Update Play Store Listing

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Assets to upload"
        required: true
        default: "all"
        type: choice
        options:
          - all        # title + descriptions + video URLs + all images
          - text       # title + descriptions + video URLs only
          - images     # app-icon + screenshots + banner only
      locale:
        description: "Locale to update, e.g. en-US or es-ES (leave empty to update all locales)"
        required: false
        default: ""
        type: string

  # Callable from release.yml or other workflows
  workflow_call:
    inputs:
      mode:
        description: "Assets to upload"
        required: false
        default: "all"
        type: string
      locale:
        description: "Locale to update, e.g. en-US (leave empty for all)"
        required: false
        default: ""
        type: string
    secrets:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        required: true

jobs:
  update-listing:
    name: "Upload listing (${{ inputs.mode }}${{ inputs.locale != '' && format(' · {0}', inputs.locale) || '' }})"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scripts/requirements.txt"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Show listing contents
        run: |
          echo "=== listing/ tree ==="
          find listing -not -name ".DS_Store" | sort

      - name: Upload listing assets
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          UPLOAD_MODE: ${{ inputs.mode || 'all' }}
          UPLOAD_LOCALE: ${{ inputs.locale }}
        run: python scripts/upload_listing.py

      - name: Summary
        if: success()
        run: |
          echo "### Play Store listing updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field  | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Mode   | \`${{ inputs.mode || 'all' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Locale | ${{ inputs.locale || 'all' }} |" >> $GITHUB_STEP_SUMMARY
