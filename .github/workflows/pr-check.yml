name: PR Check

on:
  pull_request:
    branches:
      - main
      - develop
      - "release/**"
  push:
    branches:
      - develop

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compile · Test · Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Compile debug sources
        env:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY || 'ci_placeholder' }}
          MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN || 'ci_placeholder' }}
        run: ./gradlew compileDebugKotlin --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --continue

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: "**/build/reports/tests/"
          retention-days: 7

      - name: Run Detekt (static analysis)
        run: ./gradlew detekt --continue

      - name: Upload Detekt reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: detekt-reports
          path: "**/build/reports/detekt/"
          retention-days: 7

      - name: Check for compilation warnings that block release
        run: ./gradlew lintDebug --continue

      - name: Upload Lint reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-reports
          path: "**/build/reports/lint-results*.html"
          retention-days: 7
