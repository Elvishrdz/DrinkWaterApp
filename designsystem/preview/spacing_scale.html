<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body { background: var(--paper); padding: 20px; }
.box { display:flex; align-items:center; gap:14px; margin-bottom:10px;}
.bar { background: var(--brand-water); border-radius: 4px; height: 16px; }
.lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); width: 64px; }
.val { font-family: var(--font-mono); font-size: 11px; color: var(--fg-1); }
</style></head>
<body>
  <div class="box"><div class="lbl">sp-1</div><div class="bar" style="width:4px"></div><div class="val">4 px</div></div>
  <div class="box"><div class="lbl">sp-2</div><div class="bar" style="width:8px"></div><div class="val">8 px</div></div>
  <div class="box"><div class="lbl">sp-3</div><div class="bar" style="width:12px"></div><div class="val">12 px</div></div>
  <div class="box"><div class="lbl">sp-4</div><div class="bar" style="width:16px"></div><div class="val">16 px · base</div></div>
  <div class="box"><div class="lbl">sp-5</div><div class="bar" style="width:20px"></div><div class="val">20 px</div></div>
  <div class="box"><div class="lbl">sp-6</div><div class="bar" style="width:24px"></div><div class="val">24 px · gutter</div></div>
  <div class="box"><div class="lbl">sp-7</div><div class="bar" style="width:32px"></div><div class="val">32 px</div></div>
  <div class="box"><div class="lbl">sp-8</div><div class="bar" style="width:40px"></div><div class="val">40 px · section</div></div>
</body></html>
