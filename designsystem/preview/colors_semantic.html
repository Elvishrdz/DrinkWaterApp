<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--paper); padding: 20px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .swatch { border-radius: var(--r-md); padding: 12px; height: 90px; color:#fff; display:flex; flex-direction:column; justify-content:space-between; box-shadow: var(--shadow-1); }
  .name { font-family: var(--font-rounded); font-weight:700; font-size:13px; }
  .hex { font-family: var(--font-mono); font-size:11px; opacity:.9; }
  .role { font-family: var(--font-body); font-size:11px; opacity:.85; }
</style></head>
<body>
  <div class="row">
    <div class="swatch" style="background:var(--success);"><div class="name">Success</div><div class="role">goal reached</div><div class="hex">#00A051</div></div>
    <div class="swatch" style="background:var(--warning);"><div class="name">Warning</div><div class="role">low intake</div><div class="hex">#F4A622</div></div>
    <div class="swatch" style="background:var(--danger);"><div class="name">Danger</div><div class="role">cancel / error</div><div class="hex">#D14343</div></div>
    <div class="swatch" style="background:var(--info);"><div class="name">Info</div><div class="role">water / hint</div><div class="hex">#1C8EBF</div></div>
  </div>
</body></html>
