<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--paper); padding: 20px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .swatch { border-radius: var(--r-sm); padding: 10px; height: 78px; display: flex; flex-direction: column; justify-content: space-between; }
  .swatch .name { font-family: var(--font-rounded); font-weight: 700; font-size: 12px; }
  .swatch .hex { font-family: var(--font-mono); font-size: 10px; opacity: 0.85; }
  .light { color: #fff; }
  .dark { color: var(--ink-900); }
</style></head>
<body>
  <div class="row">
    <div class="swatch light" style="background:var(--ink-900);"><div class="name">Ink 900</div><div class="hex">#0E1A20</div></div>
    <div class="swatch light" style="background:var(--ink-700);"><div class="name">Ink 700</div><div class="hex">#1F3640</div></div>
    <div class="swatch light" style="background:var(--ink-500);"><div class="name">Ink 500</div><div class="hex">#4F6772</div></div>
    <div class="swatch light" style="background:var(--ink-400);"><div class="name">Ink 400</div><div class="hex">#6B8290</div></div>
    <div class="swatch dark" style="background:var(--ink-300);"><div class="name">Ink 300</div><div class="hex">#94A8B4</div></div>
    <div class="swatch dark" style="background:var(--ink-200);"><div class="name">Ink 200</div><div class="hex">#C4D2DA</div></div>
    <div class="swatch dark" style="background:var(--ink-100);"><div class="name">Ink 100</div><div class="hex">#E2EBF0</div></div>
    <div class="swatch dark" style="background:var(--ink-50); border:1px solid var(--ink-100);"><div class="name">Ink 50</div><div class="hex">#F2F6F9</div></div>
  </div>
</body></html>
