<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body { background: var(--paper); padding: 24px; }
.spec { display:grid; grid-template-columns: 78px 1fr; gap:16px; align-items:baseline; padding: 8px 0; border-bottom: 1px solid var(--border-subtle); }
.spec:last-child { border:0; }
.label { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
</style></head>
<body>
  <div class="spec"><div class="label">BODY<br>16/23</div><p>Take a glass of water now, press the button and select the amount you took.</p></div>
  <div class="spec"><div class="label">BODY-SM<br>14/20</div><div class="t-body-sm">Between 1:00 a.m. to 12:00 p.m.</div></div>
  <div class="spec"><div class="label">CAPTION<br>12/17</div><div class="t-caption">Next in 44 minutes 36 seconds</div></div>
  <div class="spec"><div class="label">OVERLINE<br>11/16</div><div class="t-overline">Today's records</div></div>
  <div class="spec"><div class="label">BUTTON<br>14 wide</div><div class="t-button" style="color:var(--brand-magenta);">Drink water</div></div>
</body></html>
