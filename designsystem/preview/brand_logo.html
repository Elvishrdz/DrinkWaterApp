<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body { background: var(--paper); padding: 24px; }
.row { display:flex; align-items:center; gap: 24px; }
.brand { display:flex; align-items:center; gap: 14px; }
.brand img { width: 64px; height: 64px; border-radius: 14px; box-shadow: var(--shadow-2); }
.name { font-family: var(--font-rounded); font-weight: 800; font-size: 22px; color: var(--brand-water); letter-spacing: 0.04em;}
.tagline { font-family: var(--font-body); font-size: 13px; color: var(--fg-2); margin-top:2px;}
</style></head>
<body>
  <div class="row">
    <div class="brand">
      <img src="../assets/logo.png" alt="logo">
      <div>
        <div class="name">DRINK WATER</div>
        <div class="tagline">Stay hydrated, every hour</div>
      </div>
    </div>
  </div>
</body></html>
