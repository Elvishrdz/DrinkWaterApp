<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body { background: var(--bg-tint-water); padding: 24px; }
.icon-btn {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--brand-magenta); color: #fff;
  display:inline-flex; align-items:center; justify-content:center;
  box-shadow: var(--shadow-magenta);
  border: 0; cursor: pointer;
  transition: transform var(--dur-fast) var(--ease-out);
}
.icon-btn:hover { transform: scale(1.05); }
.icon-btn:active { transform: scale(0.92); }
.icon-btn svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn.outlined { background: transparent; border: 2px solid var(--brand-magenta); box-shadow: none; }
.icon-btn.outlined svg { stroke: var(--brand-magenta); }
.row { display:flex; gap:14px; align-items:center; }
.lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); margin-top: 6px; text-align:center; }
.col { display:flex; flex-direction:column; align-items:center; }
</style></head>
