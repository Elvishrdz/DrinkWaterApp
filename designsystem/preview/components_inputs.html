<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body { background: var(--paper-warm); padding: 22px; }
.field { margin-bottom: 14px; }
.label { font-family: var(--font-body); font-size: 13px; color: var(--fg-1); font-weight: 600; margin-bottom: 6px; }
.input {
  background: var(--paper); border: 1.5px solid var(--ink-200);
  border-radius: var(--r-md); padding: 12px 14px;
  font-family: var(--font-body); font-size: 16px; color: var(--fg-1);
  width: 100%;
}
.input:focus { border-color: var(--brand-water); outline: none; box-shadow: 0 0 0 4px rgba(28,142,191,0.15);}
.input.value { border-color: var(--brand-magenta); }
.hint { font-family: var(--font-body); font-size: 12px; color: var(--fg-2); margin-top: 4px; }
.row { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
</style></head>
<body>
  <div class="row">
    <div class="field">
      <div class="label">Daily goal</div>
      <input class="input value" value="2192.39 mL" />
      <div class="hint">Tap to recalculate</div>
    </div>
    <div class="field">
      <div class="label">Reminder interval</div>
      <input class="input" placeholder="45 minutes" />
      <div class="hint">Min 15 · Max 4 hours</div>
    </div>
  </div>
</body></html>
