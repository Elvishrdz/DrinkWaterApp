<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body { background: var(--paper); padding: 24px; }
.row { display:grid; grid-template-columns: repeat(6, 1fr); gap: 12px; align-items:end; }
.item { display:flex; flex-direction:column; align-items:center; gap:8px; }
.box { background: var(--brand-water); width: 64px; height: 64px; }
.lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); text-align:center; }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius: var(--r-xs);"></div><div class="lbl">xs · 6</div></div>
    <div class="item"><div class="box" style="border-radius: var(--r-sm);"></div><div class="lbl">sm · 10</div></div>
    <div class="item"><div class="box" style="border-radius: var(--r-md);"></div><div class="lbl">md · 14</div></div>
    <div class="item"><div class="box" style="border-radius: var(--r-lg);"></div><div class="lbl">lg · 20</div></div>
    <div class="item"><div class="box" style="border-radius: var(--r-xl);"></div><div class="lbl">xl · 28</div></div>
    <div class="item"><div class="box" style="border-radius: var(--r-pill);"></div><div class="lbl">pill</div></div>
  </div>
</body></html>
