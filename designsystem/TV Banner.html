<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Drink Water — Android TV Banner</title>
<link rel="stylesheet" href="colors_and_type.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { background: #0E1A20; }
  body { font-family: var(--font-body); }

  /* Base TV banner — 1280 × 720, viewed from 10ft away.
     Type scale is intentionally large + high contrast. */
  .tv {
    width: 1280px;
    height: 720px;
    position: relative;
    overflow: hidden;
    color: #fff;
    font-family: var(--font-display);
  }

  /* ====================================================
     V1 — CINEMATIC DEEP WATER
     Big lockup, centered, dramatic underwater light
     ==================================================== */
  .tv-v1 {
    background:
      radial-gradient(120% 80% at 50% 0%,  #4FB3DD 0%, #1C8EBF 28%, #0E5A82 60%, #06334B 100%);
  }
  /* god rays */
  .tv-v1::before {
    content: "";
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, transparent 0 8%, rgba(255,255,255,0.05) 8% 9%, transparent 9% 18%),
      conic-gradient(from 250deg at 50% -10%,
        transparent 0deg 50deg,
        rgba(255,255,255,0.10) 60deg 64deg,
        transparent 64deg 76deg,
        rgba(255,255,255,0.08) 84deg 87deg,
        transparent 87deg 100deg,
        rgba(255,255,255,0.06) 112deg 115deg,
        transparent 115deg 360deg);
    mix-blend-mode: screen;
    opacity: 0.7;
    pointer-events: none;
  }
  /* bubbles */
  .tv-v1::after {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 8%  82%, rgba(255,255,255,0.20) 0 8px,  transparent 9px),
      radial-gradient(circle at 14% 92%, rgba(255,255,255,0.16) 0 5px,  transparent 6px),
      radial-gradient(circle at 22% 86%, rgba(255,255,255,0.12) 0 4px,  transparent 5px),
      radial-gradient(circle at 88% 78%, rgba(255,255,255,0.18) 0 7px,  transparent 8px),
      radial-gradient(circle at 92% 88%, rgba(255,255,255,0.14) 0 5px,  transparent 6px),
      radial-gradient(circle at 78% 94%, rgba(255,255,255,0.10) 0 3px,  transparent 4px),
      radial-gradient(circle at 50% 96%, rgba(255,255,255,0.12) 0 6px,  transparent 7px),
      radial-gradient(circle at 35% 78%, rgba(255,255,255,0.08) 0 3px,  transparent 4px),
      radial-gradient(circle at 64% 84%, rgba(255,255,255,0.10) 0 4px,  transparent 5px);
    pointer-events: none;
  }

  .v1-stack {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px;
    z-index: 2;
    padding: 60px;
    text-align: center;
  }
  .v1-logo {
    width: 120px; height: 120px;
    border-radius: 32px;
    background: var(--brand-magenta);
    padding: 14px;
    box-shadow:
      0 24px 60px rgba(216,27,96,0.40),
      0 0 0 6px rgba(255,255,255,0.10);
    display: flex; align-items: center; justify-content: center;
  }
  .v1-logo img { width: 100%; height: 100%; object-fit: contain; }
  .v1-title {
    font-family: var(--font-rounded);
    font-weight: 800;
    font-size: 132px;
    line-height: 0.92;
    letter-spacing: -0.035em;
    color: #fff;
    text-wrap: balance;
    text-shadow: 0 8px 32px rgba(0,30,50,0.45);
  }
  .v1-subtitle {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 26px;
    letter-spacing: 0.02em;
    color: rgba(255,255,255,0.92);
    max-width: 880px;
    line-height: 1.35;
  }
  .v1-divider {
    width: 56px; height: 4px;
    border-radius: 2px;
    background: var(--brand-magenta-pop);
    box-shadow: 0 0 24px rgba(216,27,96,0.7);
  }

  /* ====================================================
     V2 — SPLIT LOCKUP (left brand, right glass)
     ==================================================== */
  .tv-v2 {
    background:
      linear-gradient(105deg,
        #6A1559 0%,
        #902178 28%,
        #A22C83 56%,
        #1C8EBF 100%);
  }
  .tv-v2::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(closest-side at 78% 50%, rgba(14,90,130,0.55) 0%, rgba(14,90,130,0) 65%),
      radial-gradient(closest-side at 26% 30%, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 60%);
    pointer-events: none;
  }
  .v2-left {
    position: absolute;
    left: 90px; top: 0; bottom: 0;
    width: 620px;
    display: flex; flex-direction: column; justify-content: center;
    gap: 28px;
    z-index: 3;
  }
  .v2-brand {
    display: inline-flex; align-items: center; gap: 22px;
  }
  .v2-brand .ico {
    width: 96px; height: 96px;
    border-radius: 24px;
    background: #fff;
    padding: 12px;
    box-shadow: 0 16px 36px rgba(0,0,0,0.25);
    display: flex; align-items: center; justify-content: center;
  }
  .v2-brand .ico img { width: 100%; height: 100%; object-fit: contain; }
  .v2-brand .name {
    font-family: var(--font-rounded);
    font-weight: 800;
    font-size: 56px;
    color: #fff;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .v2-brand .name span {
    display: block;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.78);
    margin-top: 8px;
  }
  .v2-headline {
    font-family: var(--font-rounded);
    font-weight: 800;
    font-size: 96px;
    line-height: 0.94;
    letter-spacing: -0.03em;
    color: #fff;
    text-wrap: balance;
  }
  .v2-headline em {
    font-style: normal;
    color: #FFE3F1;
  }
  .v2-tagline {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 22px;
    color: rgba(255,255,255,0.88);
    line-height: 1.4;
    max-width: 540px;
  }

  /* Big glass on right */
  .v2-glass {
    position: absolute;
    right: 110px; top: 50%;
    transform: translateY(-50%) rotate(-3deg);
    z-index: 2;
    filter: drop-shadow(0 30px 60px rgba(0,30,50,0.40));
  }
  /* wave band */
  .v2-wave {
    position: absolute; left: 0; right: 0; bottom: 0; height: 160px;
    z-index: 1;
  }

  /* ====================================================
     V3 — LIGHT / FRESH (mirror of Feature Graphic V3)
     ==================================================== */
  .tv-v3 {
    background:
      linear-gradient(180deg, #F2F8FB 0%, #DCEEF6 60%, #B8DEEC 100%);
    color: #0E1A20;
  }
  /* warm corner glow */
  .tv-v3::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(60% 80% at 100% 0%, rgba(255,200,120,0.20) 0%, transparent 60%);
    pointer-events: none;
  }
  /* decorative ripples (top-right) */
  .v3-ripples {
    position: absolute;
    right: -120px; top: -120px;
    z-index: 1;
    opacity: 0.55;
    pointer-events: none;
  }
  .v3-content {
    position: absolute;
    left: 90px; top: 0; bottom: 0;
    width: 760px;
    display: flex; flex-direction: column; justify-content: center;
    gap: 26px;
    z-index: 3;
    color: var(--ink-900);
  }
  .v3-brandline {
    display: inline-flex; align-items: center; gap: 18px;
    align-self: flex-start;
  }
  .v3-brandline .ico {
    width: 72px; height: 72px;
    border-radius: 18px;
    background: var(--brand-magenta);
    padding: 9px;
    box-shadow: var(--shadow-magenta);
    display: flex; align-items: center; justify-content: center;
  }
  .v3-brandline .ico img { width: 100%; height: 100%; object-fit: contain; }
  .v3-brandline .name {
    font-family: var(--font-rounded);
    font-weight: 800;
    font-size: 36px;
    color: var(--ink-900);
    letter-spacing: -0.01em;
  }
  .v3-title {
    font-family: var(--font-rounded);
    font-weight: 800;
    font-size: 108px;
    line-height: 0.94;
    letter-spacing: -0.03em;
    color: var(--brand-water-deep);
    text-wrap: balance;
  }
  .v3-title em {
    font-style: normal;
    color: var(--brand-magenta);
  }
  .v3-sub {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 24px;
    line-height: 1.45;
    color: var(--ink-500);
    max-width: 640px;
  }
  /* big glass on right */
  .v3-glass {
    position: absolute;
    right: 110px; top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    filter: drop-shadow(0 20px 40px rgba(14,90,130,0.25));
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" data-presets="react">
const { useState } = React;

/* Tall glass — reused at large scale for TV */
function GlassFull({ width = 360, fillPct = 76, accent = "#4FB3DD", deep = "#0E5A82", outline = "#fff" }) {
  const h = width * 1.4;
  return (
    <svg width={width} height={h} viewBox="0 0 280 392" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="gClipTV">
          <path d="M52 28 Q52 18 62 18 L218 18 Q228 18 228 28 L210 348 Q208 372 184 372 L96 372 Q72 372 70 348 Z" />
        </clipPath>
        <linearGradient id="waterTV" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor={accent} />
          <stop offset="100%" stopColor={deep} />
        </linearGradient>
        <linearGradient id="shineTV" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor="rgba(255,255,255,0.55)" />
          <stop offset="60%" stopColor="rgba(255,255,255,0)" />
        </linearGradient>
      </defs>

      <path
        d="M52 28 Q52 18 62 18 L218 18 Q228 18 228 28 L210 348 Q208 372 184 372 L96 372 Q72 372 70 348 Z"
        fill="rgba(255,255,255,0.12)"
        stroke={outline}
        strokeWidth="5"
        strokeLinejoin="round"
      />

      <g clipPath="url(#gClipTV)">
        {(() => {
          const waterTop = 18 + (392 - 18) * (1 - fillPct / 100);
          return (
            <>
              <path
                d={`M0 ${waterTop + 18}
                    C 60 ${waterTop - 6}, 120 ${waterTop + 30}, 180 ${waterTop + 6}
                    C 230 ${waterTop - 14}, 260 ${waterTop + 10}, 280 ${waterTop + 6}
                    L 280 392 L 0 392 Z`}
                fill="url(#waterTV)"
              />
              <path
                d={`M0 ${waterTop + 30}
                    C 60 ${waterTop + 6}, 120 ${waterTop + 42}, 180 ${waterTop + 20}
                    C 230 ${waterTop + 2}, 260 ${waterTop + 26}, 280 ${waterTop + 22}`}
                fill="none" stroke="rgba(255,255,255,0.30)" strokeWidth="3"
              />
              <path
                d={`M0 ${waterTop + 50}
                    C 60 ${waterTop + 24}, 120 ${waterTop + 64}, 180 ${waterTop + 40}
                    C 230 ${waterTop + 22}, 260 ${waterTop + 50}, 280 ${waterTop + 42}`}
                fill="none" stroke="rgba(255,255,255,0.18)" strokeWidth="2"
              />
              <circle cx="100" cy={waterTop + 110} r="6" fill="rgba(255,255,255,0.55)" />
              <circle cx="160" cy={waterTop + 150} r="4" fill="rgba(255,255,255,0.45)" />
              <circle cx="125" cy={waterTop + 200} r="5" fill="rgba(255,255,255,0.40)" />
              <circle cx="185" cy={waterTop + 260} r="3" fill="rgba(255,255,255,0.50)" />
              <circle cx="90"  cy={waterTop + 270} r="4" fill="rgba(255,255,255,0.35)" />
            </>
          );
        })()}
        <rect x="60" y="40" width="12" height="280" rx="6" fill="url(#shineTV)" />
      </g>

      <path
        d="M58 28 Q58 24 64 24 L216 24 Q222 24 222 28"
        stroke="rgba(255,255,255,0.65)" strokeWidth="3" fill="none" strokeLinecap="round"
      />
    </svg>
  );
}

/* Wave band */
function WaveBand({ width = 1280, height = 160, layers }) {
  const segs = 7;
  const segW = width / segs;
  const path = (offsetY, amp, phase) => {
    let d = `M0 ${offsetY + amp * Math.sin(phase)}`;
    for (let i = 1; i <= segs; i++) {
      const x = i * segW;
      const cx1 = x - segW * 0.65;
      const cx2 = x - segW * 0.35;
      const y1 = offsetY + amp * Math.sin(phase + i * 1.3 + 0.7);
      const y2 = offsetY + amp * Math.sin(phase + i * 1.3 + 1.4);
      d += ` C ${cx1} ${y1}, ${cx2} ${y2}, ${x} ${offsetY + amp * Math.sin(phase + i * 1.3 + 2.1)}`;
    }
    d += ` L ${width} ${height} L 0 ${height} Z`;
    return d;
  };
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      {layers.map((L, i) => (
        <path key={i} d={path(L.offsetY, L.amp, L.phase)} fill={L.fill} opacity={L.opacity ?? 1} />
      ))}
    </svg>
  );
}

/* ====================== V1 ====================== */
function V1() {
  return (
    <div className="tv tv-v1" data-screen-label="TV V1 Cinematic">
      <div className="v1-stack">
        <div className="v1-logo">
          <img src="assets/app_logo_purple.png" alt="Drink Water" />
        </div>
        <div className="v1-divider"></div>
        <div className="v1-title">Drink Water</div>
        <div className="v1-subtitle">Track every sip. Reach your daily goal — beautifully.</div>
      </div>
    </div>
  );
}

/* ====================== V2 ====================== */
function V2() {
  return (
    <div className="tv tv-v2" data-screen-label="TV V2 Split Lockup">
      <div className="v2-left">
        <div className="v2-brand">
          <div className="ico"><img src="assets/app_logo_purple.png" alt="Drink Water"/></div>
          <div className="name">Drink Water<span>Hydration · Reminders</span></div>
        </div>
        <div className="v2-headline">Every sip,<br/><em>tracked.</em></div>
        <div className="v2-tagline">A clean, friendly water tracker that helps you reach your daily goal, one sip at a time.</div>
      </div>

      <div className="v2-glass">
        <GlassFull width={380} fillPct={74} accent="#4FB3DD" deep="#0E5A82" outline="#FFE3F1" />
      </div>

      <div className="v2-wave">
        <WaveBand
          width={1280} height={160}
          layers={[
            { fill: "rgba(28,142,191,0.40)", offsetY: 70,  amp: 22, phase: 0.4 },
            { fill: "rgba(14,90,130,0.65)",  offsetY: 105, amp: 16, phase: 1.6 },
            { fill: "#0E5A82",               offsetY: 135, amp: 10, phase: 2.7 },
          ]}
        />
      </div>
    </div>
  );
}

/* ====================== V3 (light / fresh) ====================== */
function V3() {
  return (
    <div className="tv tv-v3" data-screen-label="TV V3 Light Fresh">
      {/* decorative ripples top-right */}
      <svg className="v3-ripples"
        width="560" height="560" viewBox="0 0 560 560" xmlns="http://www.w3.org/2000/svg">
        {[90, 160, 240, 320, 400].map((r, i) => (
          <circle key={i} cx="280" cy="280" r={r}
            fill="none" stroke="#1C8EBF" strokeOpacity={0.10 + i * 0.04} strokeWidth="2" />
        ))}
      </svg>

      <div className="v3-content">
        <div className="v3-brandline">
          <div className="ico"><img src="assets/app_logo_purple.png" alt="Drink Water"/></div>
          <div className="name">Drink Water</div>
        </div>
        <div className="v3-title">Stay hydrated.<br/><em>Feel better.</em></div>
        <div className="v3-sub">A clean, friendly water tracker that helps you reach your daily goal, one sip at a time.</div>
      </div>

      <div className="v3-glass">
        <GlassFull width={360} fillPct={80} accent="#1C8EBF" deep="#0E5A82" outline="#0E5A82" />
      </div>

      {/* soft wave at bottom */}
      <div style={{ position: "absolute", left: 0, right: 0, bottom: 0, height: 150, zIndex: 0 }}>
        <WaveBand
          width={1280} height={150}
          layers={[
            { fill: "#A0CEDE", offsetY: 60,  amp: 18, phase: 0.4, opacity: 0.55 },
            { fill: "#7EBDD3", offsetY: 95,  amp: 14, phase: 1.7, opacity: 0.85 },
            { fill: "#4FB3DD", offsetY: 125, amp: 8,  phase: 2.6, opacity: 1.0 },
          ]}
        />
      </div>
    </div>
  );
}

/* ====================== CANVAS ====================== */
function App() {
  return (
    <DesignCanvas
      title="Android TV — Banner"
      subtitle="1280 × 720 · PNG/JPEG · English copy"
    >
      <DCSection id="tv-banner" title="Android TV Banner — Variations">
        <DCArtboard id="tv-v2" label="V2 — Split lockup + glass" width={1280} height={720}>
          <V2 />
        </DCArtboard>
        <DCArtboard id="tv-v3" label="V3 — Light / fresh" width={1280} height={720}>
          <V3 />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
