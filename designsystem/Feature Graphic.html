<style>

  /* --- Feature graphic base canvas (1024 x 500) --- */

  /* shared safe area – Play Store overlays icon/title on bottom-left of graphic

  .fg-v1::after {

  .v1-left {
    position: absolute;

    width: 560px;
    display: flex; flex-direction: column; justify-content: center;
    gap: 14px;
    z-index: 2;

  .v1-eyebrow {
    display: inline-flex; align-items: center; gap: 10px;

<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" data-presets="react">
const { useState } = React;

/* =============================================================
   SVG visuals — water glass and waves used across variations
   ============================================================= */

function GlassFull({ width = 280, fillPct = 78, accent = "#4FB3DD", deep = "#0E5A82", outline = "#fff" }) {
  // Tall glass with water level + waves
  const h = width * 1.4;
  const rim = 14;
  return (
    <svg width={width} height={h} viewBox="0 0 280 392" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="glassClip">
          <path d="M52 28 Q52 18 62 18 L218 18 Q228 18 228 28 L210 348 Q208 372 184 372 L96 372 Q72 372 70 348 Z" />
        </clipPath>
        <linearGradient id="waterGrad" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor={accent} />
          <stop offset="100%" stopColor={deep} />
        </linearGradient>
        <linearGradient id="shine" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor="rgba(255,255,255,0.55)" />
          <stop offset="60%" stopColor="rgba(255,255,255,0)" />
        </linearGradient>
      </defs>

      {/* glass outline */}
      <path
        d="M52 28 Q52 18 62 18 L218 18 Q228 18 228 28 L210 348 Q208 372 184 372 L96 372 Q72 372 70 348 Z"
        fill="rgba(255,255,255,0.10)"
        stroke={outline}
        strokeWidth="5"
        strokeLinejoin="round"
      />

      {/* water with wavy top */}
      <g clipPath="url(#glassClip)">
        {(() => {
          const waterTop = 18 + (392 - 18) * (1 - fillPct / 100);
          return (
            <>
              <path
                d={`M0 ${waterTop + 18}
                    C 60 ${waterTop - 6}, 120 ${waterTop + 30}, 180 ${waterTop + 6}
                    C 230 ${waterTop - 14}, 260 ${waterTop + 10}, 280 ${waterTop + 6}
                    L 280 392 L 0 392 Z`}
                fill="url(#waterGrad)"
              />
              <path
                d={`M0 ${waterTop + 30}
                    C 60 ${waterTop + 6}, 120 ${waterTop + 42}, 180 ${waterTop + 20}
                    C 230 ${waterTop + 2}, 260 ${waterTop + 26}, 280 ${waterTop + 22}`}
                fill="none" stroke="rgba(255,255,255,0.30)" strokeWidth="3"
              />
              <path
                d={`M0 ${waterTop + 50}
                    C 60 ${waterTop + 24}, 120 ${waterTop + 64}, 180 ${waterTop + 40}
                    C 230 ${waterTop + 22}, 260 ${waterTop + 50}, 280 ${waterTop + 42}`}
                fill="none" stroke="rgba(255,255,255,0.18)" strokeWidth="2"
              />
              {/* bubbles */}
              <circle cx="100" cy={waterTop + 110} r="6" fill="rgba(255,255,255,0.55)" />
              <circle cx="160" cy={waterTop + 150} r="4" fill="rgba(255,255,255,0.45)" />
              <circle cx="125" cy={waterTop + 200} r="5" fill="rgba(255,255,255,0.40)" />
              <circle cx="185" cy={waterTop + 260} r="3" fill="rgba(255,255,255,0.50)" />
              <circle cx="90"  cy={waterTop + 270} r="4" fill="rgba(255,255,255,0.35)" />
            </>
          );
        })()}
        {/* left highlight */}
        <rect x="60" y="40" width="12" height="280" rx="6" fill="url(#shine)" />
      </g>

      {/* rim highlight */}
      <path
        d="M58 28 Q58 24 64 24 L216 24 Q222 24 222 28"
        stroke="rgba(255,255,255,0.65)" strokeWidth="3" fill="none" strokeLinecap="round"
      />
    </svg>
  );
}

function WaveBand({ width = 1024, height = 140, layers }) {
  // layers: [{fill, offsetY, amp, phase}]
  const segs = 6;
  const segW = width / segs;
  const path = (offsetY, amp, phase) => {
    let d = `M0 ${offsetY + amp * Math.sin(phase)}`;
    for (let i = 1; i <= segs; i++) {
      const x = i * segW;
      const cx1 = x - segW * 0.65;
      const cx2 = x - segW * 0.35;
      const y1 = offsetY + amp * Math.sin(phase + i * 1.3 + 0.7);
      const y2 = offsetY + amp * Math.sin(phase + i * 1.3 + 1.4);
      d += ` C ${cx1} ${y1}, ${cx2} ${y2}, ${x} ${offsetY + amp * Math.sin(phase + i * 1.3 + 2.1)}`;
    }
    d += ` L ${width} ${height} L 0 ${height} Z`;
    return d;
  };
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      {layers.map((L, i) => (
        <path key={i} d={path(L.offsetY, L.amp, L.phase)} fill={L.fill} opacity={L.opacity ?? 1} />
      ))}
    </svg>
  );
}

/* Small inline glyphs used in V2 feature pills */
const Glyph = ({ kind, size = 16, color = "#fff" }) => {
  const common = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" };
  if (kind === "bell")  return <svg {...common}><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>;
  if (kind === "scale") return <svg {...common}><path d="M12 3v3"/><path d="M5 9h14l-2 11H7z"/><path d="M9 13h6"/></svg>;
  if (kind === "chart") return <svg {...common}><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-8"/><path d="M22 20H2"/></svg>;
  if (kind === "drop")  return <svg {...common}><path d="M12 3s7 7.6 7 12a7 7 0 0 1-14 0c0-4.4 7-12 7-12z"/></svg>;
  return null;
};

/* =============================================================
   VARIATION 1 — Water hero (phone forward)
   ============================================================= */
function V1() {
  return (
    <div className="fg fg-v1" data-screen-label="V1 Water Hero">

      <div className="v1-left">

        <div className="v1-sub">
          Set a daily goal from your weight, then get friendly nudges until you reach it. Simple, clean, and quietly persistent.
        </div>
        <div className="v1-cta-row">
          <div className="v1-pill">
            <Glyph kind="drop" size={16} />
            Start Hydrating
          </div>
          <div className="v1-meta">
            <span className="star">★ 4.8</span>
            <span style={{ opacity: 0.55 }}>·</span>
            <span>Free · No ads</span>
          </div>
        </div>
      </div>

      {/* Phone */}
      <div className="v1-phone">
        <div className="v1-phone-screen">
          <div className="v1-phone-notch"></div>
          <div className="v1-phone-cap">Today's goal</div>
          <div className="v1-phone-goal">2,200 mL</div>
          <div className="v1-ring">
            <div className="v1-ring-inner">
              <div className="v1-ring-percent">68%</div>
              <div className="v1-ring-label">1,496 mL</div>
            </div>
          </div>
          <div className="v1-cta-mini">Drink Water</div>
          <div className="v1-chip-row">
            <div className="v1-chip">+150</div>
            <div className="v1-chip">+250</div>
            <div className="v1-chip">+500</div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* =============================================================
   VARIATION 2 — Magenta + glass
   ============================================================= */
function V2() {
  return (
    <div className="fg fg-v2" data-screen-label="V2 Magenta Glass">
      <div className="v2-content">
        <div className="v2-row">
          <div className="v2-logo"><img src="assets/app_logo_purple.png" alt="Drink Water"/></div>
          <div className="v2-name">Drink Water<span>Hydration · Reminders</span></div>
        </div>
        <div className="v2-title">Every sip,<br/><em>tracked.</em></div>
        <div className="v2-features">
