<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Drink Water — Goal Reached celebration</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<link rel="stylesheet" href="../mobile/components.css"/>
<link rel="stylesheet" href="../mobile/screens.css"/>
<link rel="stylesheet" href="celebration.css"/>
<style>
  body {
    background: var(--ink-100);
    padding: 28px 24px 96px 24px;
    min-height: 100vh;
    font-family: var(--font-body);
  }
  .page-head {
    max-width: 760px; margin: 0 auto 28px auto; text-align: center;
  }
  .page-head .eyebrow {
    font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);
    letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 8px;
  }
  .page-head h1 {
    font-family: var(--font-display); font-weight: 700; font-size: 28px;
    color: var(--fg-1); margin: 0 0 8px 0; letter-spacing: -0.01em;
  }
  .page-head p {
    font-size: 14px; color: var(--fg-2); margin: 0; line-height: 1.5;
    max-width: 560px; margin: 0 auto;
  }
  .stage {
    display: flex; flex-direction: column; align-items: center; gap: 24px;
  }
  .frame-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .frame-label {
    font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);
    letter-spacing: 0.08em; text-transform: uppercase;
  }

  /* Day switcher (small toolbar so reviewer can cycle the 6 themes) */
  .day-switch {
    display: flex; gap: 6px; padding: 6px;
    background: var(--paper); border-radius: var(--r-pill);
    box-shadow: var(--shadow-1);
    border: 1px solid var(--border-subtle);
  }
  .day-switch button {
    border: 0; background: transparent;
    padding: 8px 14px; border-radius: var(--r-pill);
    font-family: var(--font-rounded); font-weight: 700; font-size: 12px;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--fg-2); cursor: pointer;
    transition: all 120ms var(--ease-out);
  }
  .day-switch button.is-active {
    background: var(--brand-magenta); color: #fff;
    box-shadow: var(--shadow-magenta);
  }
  .day-switch .auto {
    color: var(--brand-magenta);
    border: 1.5px dashed var(--brand-magenta);
    padding: 6px 12px;
  }
  .day-switch .auto.is-active {
    background: var(--brand-magenta); color: #fff; border-color: transparent;
  }

  .meta-strip {
    display: flex; gap: 24px; flex-wrap: wrap; justify-content: center;
    font-family: var(--font-body); font-size: 12px; color: var(--fg-2);
  }
  .meta-strip b { color: var(--fg-1); font-weight: 700; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Mobile UI kit foundations -->
<script type="text/babel" src="../mobile/android-frame.jsx"></script>
<script type="text/babel" src="../mobile/Components.jsx"></script>
<script type="text/babel" src="../mobile/Screens.jsx"></script>

<!-- New celebration overlay -->
<script type="text/babel" src="Celebration.jsx"></script>
</head>

<body>

<div class="page-head">
  <div class="eyebrow">Drink Water · New screen</div>
  <h1>Goal Reached — daily celebration</h1>
  <p>
    A floating moment that lands the second the user crosses today's hydration
    goal. The visual treatment + headline rotate by day-of-year, so hitting the
    goal three days in a row never feels like the same screen twice.
  </p>
</div>

<div id="root"></div>

<script type="text/babel">
const { useState } = React;

/* ---------- Mock data: a Today screen showing the goal just hit ---------- */
const fullLog = [
  { time: "07:12 a.m.", amount: 250 },
  { time: "08:48 a.m.", amount: 200 },
  { time: "10:15 a.m.", amount: 250 },
  { time: "12:08 p.m.", amount: 330 },
  { time: "01:40 p.m.", amount: 200 },
  { time: "03:22 p.m.", amount: 250 },
  { time: "05:05 p.m.", amount: 200 },
  { time: "06:48 p.m.", amount: 270 },
  { time: "08:30 p.m.", amount: 250 },
];

function App() {
  /* "auto" → use real day-of-year. Otherwise, force a specific variant index. */
  const [forced, setForced] = useState("auto");
  const goal = 2200;
  const current = fullLog.reduce((s, x) => s + x.amount, 0); // 2200 — goal hit

  const dayIndex = forced === "auto" ? null : Number(forced);
  const variantId = forced === "auto"
    ? (window.CELEBRATIONS && window.CELEBRATIONS[
        (new Date()).getDate() % window.CELEBRATIONS.length // friendly approximation for label
      ]?.id)
    : window.CELEBRATIONS[Number(forced)].id;

  const variants = window.CELEBRATIONS || [];

  return (
    <div className="stage">
      {/* Day switcher */}
      <div className="day-switch">
        <button
          className={`auto ${forced === "auto" ? "is-active" : ""}`}
          onClick={() => setForced("auto")}>
          Today
        </button>
        {variants.map((v, i) => (
          <button key={v.id}
            className={String(i) === String(forced) ? "is-active" : ""}
            onClick={() => setForced(String(i))}>
            {v.id}
          </button>
        ))}
      </div>

      {/* Phone frame: Today screen with celebration overlaid */}
      <div className="frame-wrap">
        <AndroidDevice width={390} height={780}>
          <div style={{ position: "relative", width: "100%", height: "100%" }}>
            <div className="tab-host" style={{
                width: "100%", height: "100%",
                display: "flex", flexDirection: "column"
              }}>
              <TodayScreen
                current={current} goal={goal} log={fullLog}
                onAdd={() => {}} onCustom={() => {}} onSeeAll={() => {}}
              />
              <TabBar active="today" onChange={() => {}}/>
            </div>
            <GoalCelebration
              dayIndex={dayIndex}
              goalMl={goal}
              drinkCount={fullLog.length}
              streakDays={5}
              onClose={() => {}}
              onLogBonus={() => {}}
              onShare={() => {}}
            />
          </div>
        </AndroidDevice>
        <div className="frame-label">
          {forced === "auto"
            ? `Auto — today's variant`
            : `Variant: ${variantId}`}
        </div>
      </div>

      <div className="meta-strip">
        <span>Trigger: <b>current ≥ goal</b> for the first time today</span>
        <span>Rotation: <b>day-of-year mod 6</b></span>
        <span>Dismiss: tap <b>scrim</b>, <b>×</b>, or any action</span>
      </div>
    </div>
  );
}

const styleHostTab = `
  .tab-host { width: 100%; height: 100%; display: flex; flex-direction: column; }
  .tab-host > .dw-screen { flex: 1; min-height: 0; }
`;
const s = document.createElement("style"); s.textContent = styleHostTab;
document.head.appendChild(s);

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
