<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--paper); padding: 20px; }
  .grad { border-radius: var(--r-lg); padding: 16px; height: 110px; color:#fff; display:flex; flex-direction:column; justify-content:flex-end; box-shadow: var(--shadow-1); margin-bottom: 10px; }
  .name { font-family: var(--font-rounded); font-weight:700; font-size:14px; }
  .role { font-family: var(--font-body); font-size:11px; opacity:.85; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
</style></head>
<body>
  <div class="row">
    <div class="grad" style="background: var(--grad-water-hero);"><div class="name">Water Hero</div><div class="role">main app background</div></div>
    <div class="grad" style="background: var(--grad-magenta);"><div class="name">Magenta</div><div class="role">primary CTA fill</div></div>
    <div class="grad" style="background: var(--grad-teal-soft);"><div class="name">Teal Soft</div><div class="role">brand mark surface</div></div>
    <div class="grad" style="background: var(--grad-sky-clear); color: var(--ink-900); border:1px solid var(--ink-100);"><div class="name">Sky Clear</div><div class="role">onboarding light bg</div></div>
  </div>
</body></html>
