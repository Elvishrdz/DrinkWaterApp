<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--paper); padding: 20px; }
  .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .swatch { border-radius: var(--r-md); padding: 14px; height: 96px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow-1); }
  .swatch .name { font-family: var(--font-rounded); font-weight: 700; font-size: 13px; }
  .swatch .hex { font-family: var(--font-mono); font-size: 11px; opacity: 0.85; }
  .light { color: #fff; }
  .dark { color: var(--ink-900); }
</style></head>
<body>
  <div class="row">
    <div class="swatch light" style="background:linear-gradient(180deg,#4FB3DD,#1C8EBF 50%,#0E5A82);">
      <div class="name">Brand Water</div>
      <div class="hex">#1C8EBF · hero gradient</div>
    </div>
    <div class="swatch light" style="background:var(--brand-magenta);">
      <div class="name">Brand Magenta</div>
      <div class="hex">#A22C83 · primary action</div>
    </div>
    <div class="swatch light" style="background:var(--brand-magenta-pop);">
      <div class="name">Magenta Pop</div>
      <div class="hex">#D81B60 · accent</div>
    </div>
    <div class="swatch light" style="background:var(--brand-teal);">
      <div class="name">Brand Teal</div>
      <div class="hex">#008577 · brand mark</div>
    </div>
    <div class="swatch light" style="background:var(--brand-water-deep);">
      <div class="name">Water Deep</div>
      <div class="hex">#0E5A82</div>
    </div>
    <div class="swatch light" style="background:var(--brand-teal-soft);">
      <div class="name">Teal Soft</div>
      <div class="hex">#2BA89A</div>
    </div>
  </div>
</body></html>
