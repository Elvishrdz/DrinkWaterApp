<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body { background: var(--paper); padding: 22px; }
.row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
.btn-primary {
  background: var(--grad-magenta); color:#fff; border:0;
  padding: 14px 24px; border-radius: var(--r-pill);
  font-family: var(--font-rounded); font-weight: 700; font-size: 14px;
  letter-spacing: 0.06em; text-transform: uppercase;
  box-shadow: var(--shadow-magenta);
  cursor: pointer; transition: transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);
}
.btn-primary:hover { transform: translateY(-1px); }
.btn-primary:active { transform: scale(0.97); }
.btn-secondary {
  background: var(--paper); color: var(--brand-magenta); border: 1.5px solid var(--brand-magenta);
  padding: 12px 22px; border-radius: var(--r-pill);
  font-family: var(--font-rounded); font-weight: 700; font-size: 13px;
  letter-spacing: 0.06em; text-transform: uppercase; cursor:pointer;
}
.btn-tertiary {
  background: transparent; color: var(--brand-magenta); border:0;
  padding: 12px 16px; font-family: var(--font-rounded); font-weight: 700;
  font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; cursor:pointer;
}
</style></head>
<body>
  <div class="row">
    <button class="btn-primary">Drink Water</button>
    <button class="btn-secondary">Set goal manually</button>
    <button class="btn-tertiary">Skip</button>
  </div>
  <div class="row" style="margin-top:14px;">
    <button class="btn-primary" disabled style="opacity:.45;cursor:not-allowed;">Disabled</button>
    <button class="btn-primary" style="background: var(--ink-200); color: var(--fg-2); box-shadow:none;">Inactive</button>
  </div>
</body></html>
