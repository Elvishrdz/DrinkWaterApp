<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body { background: var(--paper); padding: 22px; }
.row { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.fam { border:1px solid var(--border-subtle); border-radius: var(--r-md); padding: 16px; }
.fam .name { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); margin-bottom: 6px;}
.jak { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--fg-1); }
.nun { font-family: var(--font-rounded); font-size: 28px; font-weight: 800; color: var(--fg-1); }
.sub { font-family: var(--font-body); font-size: 13px; color: var(--fg-2); margin-top: 6px;}
</style></head>
<body>
<div class="row">
  <div class="fam">
    <div class="name">DISPLAY · BODY</div>
    <div class="jak">Plus Jakarta Sans</div>
    <div class="sub">400 · 500 · 600 · 700 · 800<br>Headings, body, UI labels</div>
  </div>
  <div class="fam">
    <div class="name">ROUNDED · NUMERIC</div>
    <div class="nun">Nunito 1.5L</div>
    <div class="sub">600 · 700 · 800<br>Big numbers, friendly CTAs</div>
  </div>
</div>
</body></html>
