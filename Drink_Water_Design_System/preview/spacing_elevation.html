<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body { background: var(--paper-warm); padding: 28px; }
.row { display:grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
.card { background: var(--paper); height: 90px; border-radius: var(--r-md); display:flex; align-items:center; justify-content:center; font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
</style></head>
<body>
  <div class="row">
    <div class="card" style="box-shadow: var(--shadow-1);">shadow-1</div>
    <div class="card" style="box-shadow: var(--shadow-2);">shadow-2</div>
    <div class="card" style="box-shadow: var(--shadow-3);">shadow-3</div>
    <div class="card" style="box-shadow: var(--shadow-water);background:var(--brand-water);color:#fff;">water</div>
    <div class="card" style="box-shadow: var(--shadow-magenta);background:var(--brand-magenta);color:#fff;">magenta</div>
  </div>
</body></html>
