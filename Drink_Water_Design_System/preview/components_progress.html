<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body { background: var(--bg-tint-water); padding: 24px; }
.bar-wrap { padding: 6px 14px; background: var(--brand-water); border-radius: var(--r-pill); color:#fff; font-family: var(--font-body); font-size: 13px; font-weight:600; text-align:center; box-shadow: var(--shadow-water); margin-bottom: 14px; }
.progress { height: 14px; background: rgba(255,255,255,0.7); border-radius: var(--r-pill); overflow:hidden; box-shadow: var(--shadow-inset); margin-bottom: 8px; }
.fill { height:100%; background: linear-gradient(90deg, #4FB3DD, #1C8EBF); border-radius: var(--r-pill); }
.row { display:flex; justify-content:space-between; font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
</style></head>
<body>
  <div class="bar-wrap">You carry 1320 mL of 2192.39 mL</div>
  <div class="progress"><div class="fill" style="width:60%"></div></div>
  <div class="row"><span>0 mL</span><span>60% · keep going</span><span>2192 mL</span></div>
</body></html>
